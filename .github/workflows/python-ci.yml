name: Python CI

# pre-commit and the tests in parallel; the caller passes only its own data.
on:
  workflow_call:
    inputs:
      postgres-db:
        description: Name of the CI Postgres database; empty for a service without one.
        type: string
        default: ''
      ci-env:
        description: Non-secret variables the service's Settings requires in CI, one KEY=value per line.
        type: string
        default: ''
      setup-script:
        description: Optional script of the service, run before the migrations and the tests.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Fabio244000/turfbook-workflows/.github/actions/setup-python-env@836fc4667b06a618a62120ba4a8db885169ce366 # main
        with:
          mypy-cache: 'true'

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: a pull request compares its files with the base commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Postgres starts in the background while the environment is prepared, instead of
      # a service the job waits for before its first step. Only when the service has a
      # database. Pinned by digest (16-alpine); Dependabot does not update it.
      # The health check uses TCP: the image's first-start server listens only on the
      # socket, so it is healthy only once the real server accepts connections.
      - name: Start Postgres
        if: inputs.postgres-db != ''
        env:
          POSTGRES_DB: ${{ inputs.postgres-db }}
          POSTGRES_IMAGE: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        run: |
          nohup docker run --detach --name postgres --publish 5432:5432 \
            --env POSTGRES_USER=turfbook --env POSTGRES_PASSWORD=turfbook \
            --env POSTGRES_DB="$POSTGRES_DB" \
            --health-cmd 'pg_isready -h 127.0.0.1 -U turfbook' --health-interval 1s \
            "$POSTGRES_IMAGE" > "$RUNNER_TEMP/postgres.log" 2>&1 &

      - uses: Fabio244000/turfbook-workflows/.github/actions/setup-python-env@836fc4667b06a618a62120ba4a8db885169ce366 # main

      - name: Service environment
        env:
          POSTGRES_DB: ${{ inputs.postgres-db }}
          CI_ENV: ${{ inputs.ci-env }}
        run: |
          if [ -n "$POSTGRES_DB" ]; then
            echo "DATABASE_URL=postgresql+psycopg://turfbook:turfbook@localhost:5432/$POSTGRES_DB" >> "$GITHUB_ENV"
          fi
          if [ -n "$CI_ENV" ]; then
            printf '%s\n' "$CI_ENV" >> "$GITHUB_ENV"
          fi

      - name: Service setup
        if: inputs.setup-script != ''
        env:
          SETUP_SCRIPT: ${{ inputs.setup-script }}
        run: bash "$SETUP_SCRIPT"

      - name: Wait for Postgres
        if: inputs.postgres-db != ''
        run: |
          for _ in $(seq 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' postgres 2>/dev/null || true)
            if [ "$status" = healthy ]; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/postgres.log"
          exit 1

      - name: Migrations
        if: inputs.postgres-db != ''
        run: alembic upgrade head

      - uses: Fabio244000/turfbook-workflows/.github/actions/run-tests@ce3186728c568de1a3fc4ebdabedfa2a43af86cd # main
