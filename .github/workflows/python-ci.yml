name: Python CI

# Pre-commit, Tests and Audit in parallel (the required checks); Coverage outside a pull
# request (inside the deploy). The caller passes only its own data.
on:
  workflow_call:
    inputs:
      postgres-db:
        description: Name of the CI Postgres database; empty for a service without one.
        type: string
        default: ''
      ci-env:
        description: Non-secret variables the service's Settings requires in CI, one KEY=value per line.
        type: string
        default: ''
      setup-script:
        description: Optional script of the service, run before the migrations and the tests.
        type: string
        default: ''
      ref:
        description: Commit to test; empty for the commit of the event (a redeploy passes an earlier one).
        type: string
        default: ''

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: Fabio244000/turfbook-workflows/.github/actions/setup-python-env@836fc4667b06a618a62120ba4a8db885169ce366 # main
        with:
          mypy-cache: 'true'

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: a pull request compares its files with the base commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          fetch-depth: 0

      - uses: Fabio244000/turfbook-workflows/.github/actions/setup-service@b2570ba18424ee888122012fc0c67136bacbae70 # main
        with:
          postgres-db: ${{ inputs.postgres-db }}
          ci-env: ${{ inputs.ci-env }}
          setup-script: ${{ inputs.setup-script }}

      # A model change without its revision fails.
      - name: Migrations match the models
        if: inputs.postgres-db != ''
        run: alembic check

      - uses: Fabio244000/turfbook-workflows/.github/actions/run-tests@ce3186728c568de1a3fc4ebdabedfa2a43af86cd # main

  # Outside a pull request only: testmon stops recording under coverage, so the whole
  # suite with coverage runs in its own job, in parallel with Tests.
  coverage:
    name: Coverage
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: Fabio244000/turfbook-workflows/.github/actions/setup-service@b2570ba18424ee888122012fc0c67136bacbae70 # main
        with:
          postgres-db: ${{ inputs.postgres-db }}
          ci-env: ${{ inputs.ci-env }}
          setup-script: ${{ inputs.setup-script }}

      - name: Whole suite with coverage of at least 90%
        run: pytest --cov=app --cov-fail-under=90

  # A known vulnerability in a runtime dependency fails CI.
  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Audit runtime dependencies
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements/base.txt
