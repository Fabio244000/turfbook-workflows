name: Set up Serverless
description: Node 22 and the deploy tooling of package.json (Serverless pinned as a dev dependency).

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: npm

    - name: Install deploy tooling
      shell: bash
      run: npm ci
