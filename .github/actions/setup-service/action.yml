name: Set up the service for its tests
description: >-
  Postgres (only for a service with a database, started in the background while the
  environment is prepared), the Python environment, the service's CI variables and setup
  script, and the migrations. Used by the Tests and Coverage jobs of python-ci.yml.

inputs:
  postgres-db:
    description: Name of the CI Postgres database; empty for a service without one.
    required: false
    default: ''
  ci-env:
    description: Non-secret variables the service's Settings requires in CI, one KEY=value per line.
    required: false
    default: ''
  setup-script:
    description: Optional script of the service, run before the migrations and the tests.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Pinned by digest (16-alpine); Dependabot does not update it. The health check uses
    # TCP: the image's first-start server listens only on the socket, so it is healthy
    # only once the real server accepts connections.
    - name: Start Postgres
      if: inputs.postgres-db != ''
      shell: bash
      env:
        POSTGRES_DB: ${{ inputs.postgres-db }}
        POSTGRES_IMAGE: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
      run: |
        nohup docker run --detach --name postgres --publish 5432:5432 \
          --env POSTGRES_USER=turfbook --env POSTGRES_PASSWORD=turfbook \
          --env POSTGRES_DB="$POSTGRES_DB" \
          --health-cmd 'pg_isready -h 127.0.0.1 -U turfbook' --health-interval 1s \
          "$POSTGRES_IMAGE" > "$RUNNER_TEMP/postgres.log" 2>&1 &

    - uses: Fabio244000/turfbook-workflows/.github/actions/setup-python-env@836fc4667b06a618a62120ba4a8db885169ce366 # main

    # The next steps of the job (alembic check, the tests, coverage) need these variables:
    # GITHUB_ENV is the only way to pass them. Both inputs are literals of the calling
    # service's own ci.yml, never event data (titles, branches): whoever could change
    # them can already change that ci.yml, so this grants nothing more.
    - name: Service environment
      shell: bash
      env:
        POSTGRES_DB: ${{ inputs.postgres-db }}
        CI_ENV: ${{ inputs.ci-env }}
      run: | # zizmor: ignore[github-env]
        if [ -n "$POSTGRES_DB" ]; then
          echo "DATABASE_URL=postgresql+psycopg://turfbook:turfbook@localhost:5432/$POSTGRES_DB" >> "$GITHUB_ENV"
        fi
        if [ -n "$CI_ENV" ]; then
          printf '%s\n' "$CI_ENV" >> "$GITHUB_ENV"
        fi

    - name: Service setup
      if: inputs.setup-script != ''
      shell: bash
      env:
        SETUP_SCRIPT: ${{ inputs.setup-script }}
      run: bash "$SETUP_SCRIPT"

    - name: Wait for Postgres
      if: inputs.postgres-db != ''
      shell: bash
      run: |
        for _ in $(seq 60); do
          status=$(docker inspect --format '{{.State.Health.Status}}' postgres 2>/dev/null || true)
          if [ "$status" = healthy ]; then exit 0; fi
          sleep 1
        done
        cat "$RUNNER_TEMP/postgres.log"
        exit 1

    # A repo with Postgres but without Alembic (turfbook-platform: its tests need a
    # server, it has no migrations of its own) skips them.
    - name: Migrations
      if: inputs.postgres-db != ''
      shell: bash
      run: |
        if [ -f alembic.ini ]; then
          alembic upgrade head
        else
          echo 'No alembic.ini: no migrations to apply.'
        fi
